[pytest]
# 确保控制台输出使用 UTF-8
console_output_style = progress
;console_output_style = classic

;addopts = -vv --tb=short



;方法 2：在 PyCharm 中配置（永久）
;打开 Run -> Edit Configurations。
;找到你的 pytest 配置。
;在 Environment variables 中添加：PYTHONIOENCODING=utf-8


#-----------------------------------------------------注册执行用例标记---------------------------------------
markers =
    dependency: 用例依赖
    smoke: 冒烟测试
    slow: 耗时较长的测试
    ui: UI 自动化测试
    api: 接口自动化测试
    debug: 调试用
    test: 测试
    login: 登录



#-----------------------------------------------------allure是一个测试报告框架-------------------------------------
;清空 allure-results 目录；
;执行所有测试；
;将本次测试的 Allure 原始结果写入 allure-results。
#第一步骤：报告配置，生成报告数据
addopts = --alluredir=allure-results --clean-alluredir

#第二步骤：把allure-results目录下的数据，生成可视化allure的报告
#  allure generate -o report -c allure-results



#------------------------------------------------------配置日志---------------------------------------------------

log_file = ./logs/pytest.log
log_file_level = info
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s]:%(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

;记录用例执行结果
result_log_enable = 1
;记录用例分割线
result_log_separator = 1
;分割线等级
result_log_level_separator= warning
;异常信息等级
result_log_level_verbose = info


